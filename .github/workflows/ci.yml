name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Unit and local control tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Shell syntax
        run: bash -n install.sh mac/install.sh mac/install-cli.sh mac/EgoBridgeApp/build-app.sh linux/install.sh scripts/build-dmg.sh scripts/package-release.sh tests/e2e_loopback_v2.sh
      - name: Build and verify macOS App and DMG
        if: runner.os == 'macOS'
        run: |
          bash scripts/package-release.sh macos
